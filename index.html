<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal Nexus | Loading</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05080c;          /* dark fallback before video loads */
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  /* Fullscreen background video, cropped to fill any screen ratio */
  #bg {
    position: fixed;
    top: 50%; left: 50%;
    min-width: 100%; min-height: 100%;
    width: auto; height: auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
    z-index: 0;
  }
  /* Optional subtle loading indicator (delete this block if you don't want it) */
  #status {
    position: fixed;
    left: 0; right: 0; bottom: 6%;
    text-align: center;
    color: #cfe0f5;
    letter-spacing: 3px;
    font-size: 18px;
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0,0,0,.8);
    z-index: 2;
  }
  #status .dots::after {
    content: "";
    animation: dots 1.4s steps(4, end) infinite;
  }
  @keyframes dots { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} }
</style>
</head>
<body>
  <!-- Background video (silent). Keep it in the SAME folder as this file. -->
  <video id="bg" autoplay muted loop playsinline preload="auto">
    <source src="TerminalNexus_LoadingScreen_silent.webm" type="video/mp4">
  </video>

  <!-- YOUR MUSIC: drop an mp3 named music.mp3 in the same folder
       (or change the filename below to match yours). -->
  <audio id="music" autoplay loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div id="status">Loading<span class="dots"></span></div>

  <script>
    var music = document.getElementById('music');

    // ---- Set your music loudness here (0.0 = silent, 1.0 = full) ----
    var TARGET_VOLUME = 0.5;
    music.volume = TARGET_VOLUME;

    // Respect each player's in-game Music Volume (snd_musicvolume).
    // GMod passes it as the 7th argument to GameDetails (a value from 0 to 1),
    // so players who turned music down in-game won't get blasted.
    function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume) {
      if (typeof volume === 'number') music.volume = TARGET_VOLUME * volume;
    }
    function SetFilesTotal(total) {}
    function SetFilesNeeded(needed) {}
    function DownloadingFile(filename) {}
    function AllFilesDownloaded() {}
    function SetStatusChanged(status) {
      var el = document.getElementById('status');
      if (el && status) el.firstChild.nodeValue = status;
    }

    // GMod's loading browser allows autoplay, but normal browsers block audio
    // until you interact. This makes the music start on first click/keypress
    // when you're testing the page in Chrome/Firefox.
    function kick(){ music.play().catch(function(){}); }
    window.addEventListener('load', kick);
    document.addEventListener('click', kick);
    document.addEventListener('keydown', kick);
  </script>
</body>
</html>
